
# Tiny Tapeout project information
project:
  title:        "Notre Dame Football ASIC"      # Project title
  author:       "Evaristo Campos de Abreu Ribeiro"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Notre Dame football themed Pong on VGA, played with an SNES controller or two push buttons"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25175000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_evaristocaribeiro_notredamefootballasic"
  
  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "project.v"
    - "gamepad_pmod.v"
    - "hvsync_generator.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "Paddle Up (active high, pull-down)"
  ui[1]: "Paddle Down (active high, pull-down)"
  ui[2]: ""
  ui[3]: ""
  ui[4]: "Latch (Gamepad PMOD)"
  ui[5]: "Clock (Gamepad PMOD)"
  ui[6]: "Data (Gamepad PMOD)"
  ui[7]: ""

  # Outputs
  uo[0]: "R1 (VGA PMOD)"
  uo[1]: "G1 (VGA PMOD)"
  uo[2]: "B1 (VGA PMOD)"
  uo[3]: "VSync (VGA PMOD)"
  uo[4]: "R0 (VGA PMOD)"
  uo[5]: "G0 (VGA PMOD)"
  uo[6]: "B0 (VGA PMOD)"
  uo[7]: "HSync (VGA PMOD)"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
